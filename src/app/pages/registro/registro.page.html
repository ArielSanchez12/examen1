<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Crear Cuenta</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="outline" (click)="goToLogin()">
        <ion-icon slot="icon-only" name="log-in-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding registro-content">

  <form [formGroup]="registroForm" (ngSubmit)="onRegister()">
    <ion-item>
      <ion-input label="Nombre" labelPlacement="floating" formControlName="nombre" placeholder="Tu nombre"></ion-input>
    </ion-item>
    <div class="error" *ngIf="registroForm.get('nombre')?.touched && registroForm.get('nombre')?.invalid">
      Ingresa un nombre válido
    </div>

    <ion-item>
      <ion-input type="email" label="Email" labelPlacement="floating" formControlName="email" placeholder="tu@correo.com"></ion-input>
    </ion-item>
    <div class="error" *ngIf="registroForm.get('email')?.touched && registroForm.get('email')?.invalid">
      Ingresa un email válido
    </div>

    <ion-item>
      <ion-input type="tel" label="Teléfono" labelPlacement="floating" formControlName="telefono" placeholder="10 dígitos"></ion-input>
    </ion-item>
    <div class="error" *ngIf="registroForm.get('telefono')?.touched && registroForm.get('telefono')?.invalid">
      Ingresa un teléfono válido (10 dígitos)
    </div>

    <ion-item>
      <ion-input type="password" label="Contraseña" labelPlacement="floating" formControlName="password" placeholder="Mínimo 6 caracteres"></ion-input>
    </ion-item>
    <div class="error" *ngIf="registroForm.get('password')?.touched && registroForm.get('password')?.invalid">
      La contraseña debe tener al menos 6 caracteres
    </div>

    <ion-item>
      <ion-input type="password" label="Confirmar contraseña" labelPlacement="floating" formControlName="confirmPassword" placeholder="Repite la contraseña"></ion-input>
    </ion-item>
    <div class="error" *ngIf="registroForm.hasError('passwordMismatch') && (registroForm.get('confirmPassword')?.touched || registroForm.get('password')?.touched)">
      Las contraseñas no coinciden
    </div>

    <ion-button expand="block" color="primary" type="submit" [disabled]="loading || registroForm.invalid">
      <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
      <span *ngIf="!loading">Crear cuenta</span>
    </ion-button>
  </form>

  <div class="divider"></div>

  <div class="registro-link">
    <p>¿Ya tienes cuenta?</p>
    <ion-button fill="outline" (click)="goToLogin()">Iniciar sesión</ion-button>
  </div>
</ion-content>
