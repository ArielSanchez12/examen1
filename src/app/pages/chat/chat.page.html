<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/pages/mis-contrataciones"></ion-back-button>
    </ion-buttons>
    <ion-title *ngIf="contratacion">
      Chat - {{ contratacion.planes_moviles?.nombre }}
    </ion-title>
    <ion-title *ngIf="!contratacion">Chat</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content #contentChat scroll-events="true" class="chat-content">
  <!-- Mensajes -->
  <div class="mensajes-container">
    <div *ngIf="mensajes.length === 0" class="sin-mensajes">
      <ion-icon name="chatbubbles-outline"></ion-icon>
      <p>Aún no hay mensajes. ¡Inicia la conversación!</p>
    </div>

    <div
      *ngFor="let mensaje of mensajes"
      class="mensaje"
      [ngClass]="{ 'mensaje-propio': isMine(mensaje) }"
    >
      <div class="bubble" [ngClass]="{ 'bubble-propio': isMine(mensaje) }">
        <p class="remitente" *ngIf="!isMine(mensaje)">
          {{ mensaje.emisor === contratacion?.usuario_id ? 'Usuario' : 'Asesor' }}
        </p>
        <p class="texto-mensaje">{{ mensaje.mensaje }}</p>
        <small class="hora">
          {{ mensaje.fecha | date: 'short' }}
        </small>
      </div>
    </div>
  </div>
</ion-content>

<ion-footer>
  <div class="input-container">
    <ion-item lines="none">
      <ion-textarea
        [(ngModel)]="nuevoMensaje"
        placeholder="Escribe tu mensaje..."
        rows="3"
        maxlength="500"
        (keypress)="onKeyPress($event)"
        [disabled]="sending"
      ></ion-textarea>
      <ion-button
        slot="end"
        color="primary"
        fill="clear"
        (click)="enviarMensaje()"
        [disabled]="!nuevoMensaje.trim() || sending"
      >
        <ion-icon slot="icon-only" name="send-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </div>
</ion-footer>
