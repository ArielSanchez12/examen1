<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/pages/asesor/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ isEditMode ? 'Editar' : 'Crear' }} Plan</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="!loading" class="ion-padding">
  <form [formGroup]="planForm" (ngSubmit)="guardarPlan()">
    <!-- Sección de Imagen -->
    <ion-card class="imagen-card">
      <ion-card-header>
        <ion-card-title>Imagen Promocional</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <div *ngIf="previewUrl" class="imagen-preview">
          <img [src]="previewUrl" alt="Preview" />
          <ion-button color="danger" fill="clear" size="small" (click)="previewUrl = null; selectedFile = null">
            <ion-icon slot="start" name="trash-outline"></ion-icon>
            Eliminar
          </ion-button>
        </div>

        <ion-button fill="outline" expand="block" (click)="seleccionarImagen()" [disabled]="!!previewUrl">
          <ion-icon slot="start" name="image-outline"></ion-icon>
          Seleccionar Imagen (JPG/PNG)
        </ion-button>
      </ion-card-content>
    </ion-card>

    <!-- Información Básica -->
    <ion-card>
      <ion-card-header>
        <ion-card-title>Información Básica</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-item>
          <ion-input label="Nombre del Plan" labelPlacement="floating" formControlName="nombre"
            placeholder="Ej: Plan Smart 5GB"></ion-input>
        </ion-item>

        <ion-item>
          <ion-input label="Precio (USD)" labelPlacement="floating" type="number" step="0.01" formControlName="precio"
            placeholder="Ej: 15.99"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label>Segmento</ion-label>
          <ion-select formControlName="segmento" interface="popover">
            <ion-select-option value="Básico / Entrada">Básico / Entrada</ion-select-option>
            <ion-select-option value="Medio / Estándar">Medio / Estándar</ion-select-option>
            <ion-select-option value="Premium / Alto">Premium / Alto</ion-select-option>
          </ion-select>
        </ion-item>

        <ion-item>
          <ion-input label="Público Objetivo" labelPlacement="floating" formControlName="publico_objetivo"
            placeholder="Ej: Estudiantes, uso casual"></ion-input>
        </ion-item>

        <ion-item>
          <ion-input label="Datos Móviles" labelPlacement="floating" formControlName="datos"
            placeholder="Ej: 5 GB mensuales (4G LTE)"></ion-input>
        </ion-item>

        <ion-item>
          <ion-input label="Minutos de Voz" labelPlacement="floating" formControlName="minutos"
            placeholder="Ej: 100 minutos nacionales"></ion-input>
        </ion-item>

        <ion-item>
          <ion-input label="SMS" labelPlacement="floating" formControlName="sms"
            placeholder="Ej: Ilimitados"></ion-input>
        </ion-item>

        <ion-item>
          <ion-input label="Velocidad / Tecnología" labelPlacement="floating" formControlName="velocidad"
            placeholder="Ej: 4G LTE hasta 50 Mbps"></ion-input>
        </ion-item>

        <ion-item>
          <ion-input label="Redes Sociales" labelPlacement="floating" formControlName="redes_sociales"
            placeholder="Ej: Facebook, Instagram (incluidas)"></ion-input>
        </ion-item>
      </ion-card-content>
    </ion-card>

    <!-- Estado -->
    <ion-card>
      <ion-card-content>
        <ion-item lines="none">
          <ion-label>Plan Activo</ion-label>
          <ion-toggle formControlName="activo" color="primary"></ion-toggle>
        </ion-item>
      </ion-card-content>
    </ion-card>

    <!-- Botones -->
    <div class="acciones">
      <ion-button expand="block" color="primary" type="submit" [disabled]="planForm.invalid || loading">
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        <span *ngIf="!loading">{{ isEditMode ? 'Actualizar' : 'Crear' }} Plan</span>
      </ion-button>

      <ion-button expand="block" fill="outline" type="button" (click)="cancelar()">
        Cancelar
      </ion-button>
    </div>
  </form>
</ion-content>

<div *ngIf="loading" class="text-center" style="padding: 80px 20px;">
  <ion-spinner name="crescent"></ion-spinner>
  <p>Cargando plan...</p>
</div>
